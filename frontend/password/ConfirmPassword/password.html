<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/password/ConfirmPassword/password.css">
    <script src="https://kit.fontawesome.com/b452e5bdc3.js" crossorigin="anonymous"></script>

    <title>Şifre Belirle</title>
</head>
<body>
    <div class="container"> 
        <!--Sol kutu-->
        <div class="left-box">
            <form id="PasswordForm">
                <h2 class="baslik">Şifre Belirleme</h2>
                <p>Hesabınıza giriş yapabilmek için lütfen kendi şifrenizi belirleyin.</p>
                <br>
                <div class="input-box">
                    <input type="password" id="newPassword" required placeholder="Yeni Şifre">
                    <div class="checkbox" id="togglePassword1"> 
                        <i class="fa-regular fa-eye"></i>
                    </div>
                </div>
                <br>
                <div class="input-box">
                    <input type="password" id="confirmPassword" required placeholder="Yeni Şifre (Tekrar)">
                    <div class="checkbox" id="togglePassword2"> 
                        <i class="fa-regular fa-eye"></i>
                    </div>
                </div>
                <button type="submit" class="btn">Şifreyi Kaydet</button>
            </form>
        </div>
        <!--Sağ kutu-->
        <div class="right-box">
            <img class="resim" id="resim" src="/frontend/picture/resimbeyaz.png" alt="resim">
        </div>
    </div>
    <script src="/frontend/password/ConfirmPassword/password.js?v=2" defer></script>
</body>

</html>
