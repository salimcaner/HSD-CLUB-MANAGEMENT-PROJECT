<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/password/UpdatePassword/UpdatePassword.css">
    <script src="https://kit.fontawesome.com/b452e5bdc3.js" crossorigin="anonymous"></script>
    <title>Şifre Yenile</title>
</head>
<body>
    <div class="container">
        <div class="left-box">
            <form id="UpdatePasswordForm">
                <h2 class="baslik">Şifre Yenileme</h2>
                <p>Hesap güvenliğiniz için mevcut şifrenizi doğrulayın ve yeni şifrenizi belirleyin.</p>

                <div class="input-box">
                    <input type="password" id="oldPassword" required placeholder="Eski Şifre" autocomplete="current-password">
                    <div class="checkbox" id="toggleOldPassword">
                        <i class="fa-regular fa-eye"></i>
                    </div>
                </div>

                <div class="input-box">
                    <input type="password" id="newPassword" required placeholder="Yeni Şifre" autocomplete="new-password">
                    <div class="checkbox" id="toggleNewPassword">
                        <i class="fa-regular fa-eye"></i>
                    </div>
                </div>

                <div class="input-box">
                    <input type="password" id="confirmPassword" required placeholder="Yeni Şifre Tekrar" autocomplete="new-password">
                    <div class="checkbox" id="toggleConfirmPassword">
                        <i class="fa-regular fa-eye"></i>
                    </div>
                </div>

                <div class="password-rules">
                    <p>Yeni şifre en az 6 karakter olmalı ve en az bir büyük, bir küçük harf içermelidir.</p>
                </div>

                <div id="passwordMessage" class="login-message"></div>
                <button type="submit" class="btn">Şifreyi Güncelle</button>
            </form>
        </div>

        <div class="right-box">
            <img class="resim" id="resim" src="/frontend/picture/resimbeyaz.png" alt="Kulüp yönetimi görseli">
        </div>
    </div>

    <script src="/frontend/password/UpdatePassword/UpdatePassword.js?v=1" defer></script>
</body>
</html>
